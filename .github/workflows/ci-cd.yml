# .github/workflows/ci-cd.yml
# One pipeline: quality checks on every PR and push; deploy only after
# checks pass on a push to dev, test or main.
name: CI-CD

on:
  pull_request:
    branches: [dev, test, main]
  push:
    branches: [dev, test, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: deploy
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # main -> production, test -> staging, dev -> development
    environment: ${{ github.ref_name == 'main' && 'production' || (github.ref_name == 'test' && 'staging' || 'development') }}
    # actions: read lets the budget check below count earlier pipeline runs.
    permissions:
      contents: read
      actions: read
    # Secrets are given only to the steps that need them (not the whole job),
    # so npm install scripts and the build never see them.
    steps:
      # Netlify free plan: 300 credits/month, 15 per production deploy.
      # Course rule: at most 2 production deploys in any 7 days.
      - name: Production budget check (max 2 per 7 days)
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_PER_WEEK: 2
        run: |
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci-cd.yml/runs" \
            -f branch=main -f event=push -f status=success -f "created=>=$SINCE" \
            --jq '.total_count')
          echo "Successful production deploys since $SINCE: $COUNT (limit $MAX_PER_WEEK)"
          if [ "$COUNT" -ge "$MAX_PER_WEEK" ]; then
            echo "::error::Weekly production limit reached ($COUNT/$MAX_PER_WEEK). Not deploying, to save Netlify credits. Try again after the oldest deploy is 7 days old."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: ${{ vars.APP_ENV }}

      - name: Build frontend
        run: npm run build
        env:
          VITE_APP_ENV: ${{ vars.APP_ENV }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          APP_ENV: ${{ vars.APP_ENV }}
          APP_URL: ${{ vars.APP_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          # Until Google sign-in: the API acts as this demo user. Empty = API refuses (fails closed).
          DEMO_USER_ID: ${{ vars.DEMO_USER_ID }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TARGET="--prod"
          else
            TARGET="--alias=$GITHUB_REF_NAME"
          fi
          npx netlify deploy $TARGET --no-build \
            --dir=dist --functions=netlify/functions \
            --message="$GITHUB_SHA" \
            --env="APP_ENV=$APP_ENV" \
            --env="APP_URL=$APP_URL" \
            --env="GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" \
            --env="DEMO_USER_ID=$DEMO_USER_ID" \
            --secret-env="DATABASE_URL=$DATABASE_URL" \
            --secret-env="SESSION_SECRET=$SESSION_SECRET" \
            --secret-env="TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY" \
            --secret-env="STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" \
            --secret-env="STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET"
